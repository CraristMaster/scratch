<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Implementation</title>
    <style>
        table,th,td{
            padding: 25px;
            color: darkgreen;
            border-collapse: collapse;
            border: 1.5px groove rgba(17, 96, 150, 0.493);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
    <form>
        <table>
            <thead>
                <tr>
                    <th>1</th>
                    <th>6</th>
                    <th>10</th>
                    <th>5</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>2</th>
                    <th>7</th>
                    <th>9</th>
                    <th>4</th>
                </tr>
                 <tr>
                    <th>3</th>
                    <th>8</th>
                    <th>8</th>
                    <th>3</th>
                </tr>
                 <tr>
                    <th>4</th>
                    <th>9</th>
                    <th>7</th>
                    <th>2</th>
                </tr>
                 <tr>
                    <th>5</th>
                    <th>10</th>
                    <th>6</th>
                    <th>1</th>
                </tr>
            </tbody>
        </table>
    </form>
</body>
</html>
